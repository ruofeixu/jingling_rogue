<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1334" width="750" height="1334" role="img" aria-labelledby="titleFrameTitle titleFrameDesc">
  <title id="titleFrameTitle">契灵志怪标题页关键帧</title>
  <desc id="titleFrameDesc">明亮童话山野聚落，三只原创精怪在前景陪伴，中央有一个醒目的踏入山隙按钮。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9efff"/>
      <stop offset="0.58" stop-color="#f4fbef"/>
      <stop offset="1" stop-color="#fff2c9"/>
    </linearGradient>
    <linearGradient id="farHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#acd9d2"/>
      <stop offset="1" stop-color="#75b9a1"/>
    </linearGradient>
    <linearGradient id="nearHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82c883"/>
      <stop offset="1" stop-color="#47936c"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb65f"/>
      <stop offset="1" stop-color="#ff7f4c"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#355846" flood-opacity="0.2"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#294839" flood-opacity="0.24"/>
    </filter>
  </defs>

  <!-- 背景：浅色天光 -->
  <rect width="750" height="1334" fill="url(#sky)"/>
  <circle cx="620" cy="150" r="68" fill="#fff5a8" opacity="0.9"/>
  <circle cx="620" cy="150" r="92" fill="none" stroke="#fff9cf" stroke-width="18" opacity="0.55"/>
  <g fill="#ffffff" opacity="0.78">
    <path d="M30 196 C52 160 92 165 104 194 C127 169 174 180 179 214 L29 214 Z"/>
    <path d="M500 276 C518 246 556 246 570 270 C596 239 648 254 650 290 L494 290 Z"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.7">
    <path d="M95 305 Q125 283 155 305"/>
    <path d="M180 254 Q205 236 230 254"/>
    <path d="M548 353 Q577 333 605 353"/>
  </g>

  <!-- 标题徽记 -->
  <g filter="url(#smallShadow)">
    <path d="M145 76 Q375 16 605 76 L582 231 Q375 276 168 231 Z" fill="#fffdf7" stroke="#5bb8d7" stroke-width="6"/>
    <path d="M185 91 Q375 48 565 91" fill="none" stroke="#ffc85a" stroke-width="9" stroke-linecap="round"/>
    <circle cx="176" cy="107" r="10" fill="#ff8b5e"/>
    <circle cx="574" cy="107" r="10" fill="#7dcf7c"/>
    <text x="375" y="157" text-anchor="middle" fill="#3d3228" font-size="68" font-weight="800" letter-spacing="8">契灵志怪</text>
    <text x="375" y="204" text-anchor="middle" fill="#4b765f" font-size="22" font-weight="700" letter-spacing="5">山 隙 里 的 明 亮 奇 遇</text>
  </g>

  <!-- 远景山体 -->
  <path d="M0 452 Q88 331 178 430 Q282 278 390 430 Q503 302 750 452 L750 712 L0 712 Z" fill="url(#farHill)"/>
  <path d="M100 426 Q142 371 178 430 Q208 378 249 398" fill="none" stroke="#dff3dc" stroke-width="15" stroke-linecap="round" opacity="0.8"/>
  <path d="M324 388 Q361 333 392 430 Q425 378 467 399" fill="none" stroke="#dff3dc" stroke-width="15" stroke-linecap="round" opacity="0.72"/>
  <path d="M0 516 Q110 459 220 520 Q357 425 476 524 Q620 436 750 504 L750 807 L0 807 Z" fill="#79bd91"/>

