<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1334" width="750" height="1334" role="img" aria-labelledby="battleFrameTitle battleFrameDesc">
  <title id="battleFrameTitle">精怪战斗关键帧</title>
  <desc id="battleFrameDesc">明亮河泽中景里灶狸与原创精怪苔鼓兽对峙，顶部有队伍、囊与镇物，右侧为竖列术签，底部显示战况。</desc>
  <defs>
    <linearGradient id="battleSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9efff"/>
      <stop offset="0.57" stop-color="#eef8dc"/>
      <stop offset="1" stop-color="#f8e5b8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd6d1"/>
      <stop offset="1" stop-color="#4ea8a8"/>
    </linearGradient>
    <linearGradient id="logPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fff0cf"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#244d42" flood-opacity="0.21"/>
    </filter>
    <filter id="unitShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#233f36" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="750" height="1334" fill="url(#battleSky)"/>
  <circle cx="626" cy="125" r="61" fill="#fff3a5"/>
  <g fill="#ffffff" opacity="0.78">
    <path d="M32 175 Q54 143 91 166 Q116 130 162 163 Q180 174 181 194 L29 194 Z"/>
    <path d="M451 227 Q476 191 514 219 Q538 181 588 214 Q605 225 607 245 L447 245 Z"/>
  </g>

