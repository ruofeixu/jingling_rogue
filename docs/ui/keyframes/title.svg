      <path d="M70 117 L76 124 L67 124 Z" fill="#6a3b37"/>
      <path d="M107 151 Q147 145 132 112 Q160 129 148 164 Q134 196 103 177" fill="#ffad45" stroke="#52372f" stroke-width="9" stroke-linecap="round"/>
