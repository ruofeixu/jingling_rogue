      <rect x="162" y="7" width="78" height="40" rx="20" fill="#ffe5cf" stroke="#e8784b" stroke-width="3"/>
      <text x="201" y="34" text-anchor="middle" fill="#9c4e37" font-size="19" font-weight="900">炎</text>
      <rect x="250" y="7" width="114" height="40" rx="20" fill="#fff0c4" stroke="#d99b45" stroke-width="3"/>
