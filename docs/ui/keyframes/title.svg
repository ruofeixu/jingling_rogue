    <g transform="translate(82 548)">
      <path d="M0 58 L58 11 L122 58 Z" fill="#f27d5f"/>
      <rect x="16" y="56" width="91" height="69" rx="8" fill="#fff1c6"/>
      <rect x="53" y="82" width="25" height="43" rx="5" fill="#69a88c"/>
