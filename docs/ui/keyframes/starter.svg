    <ellipse cx="125" cy="207" rx="25" ry="11" fill="#bc553e" stroke="#52372f" stroke-width="6"/>
    <rect x="25" y="235" width="164" height="79" rx="20" fill="#fffdf6" stroke="#e79a61" stroke-width="4"/>
    <circle cx="47" cy="257" r="10" fill="#ff7e4f"/>
    <text x="105" y="266" text-anchor="middle" fill="#3d3228" font-size="29" font-weight="900">灶狸</text>
    <text x="105" y="296" text-anchor="middle" fill="#9c4e37" font-size="18" font-weight="800">炎 · 费用 4</text>
    <circle cx="185" cy="38" r="20" fill="#ff8753" stroke="#ffffff" stroke-width="5"/>
    <path d="M175 38 L183 46 L197 29" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
