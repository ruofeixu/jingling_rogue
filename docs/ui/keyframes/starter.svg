    <text x="287" y="93" text-anchor="middle" fill="#3b2c27" font-size="42" font-weight="900" letter-spacing="5">与灶狸结伴</text>
    <path d="M486 67 L511 88 L486 110" fill="none" stroke="#3b2c27" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
