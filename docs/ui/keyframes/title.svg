    <ellipse cx="39" cy="1112" rx="43" ry="18" transform="rotate(48 39 1112)"/>
    <ellipse cx="646" cy="1163" rx="46" ry="19" transform="rotate(25 646 1163)"/>
    <ellipse cx="714" cy="1100" rx="43" ry="18" transform="rotate(-47 714 1100)"/>
  </g>
  <g fill="#ffe46b" stroke="#754d37" stroke-width="4">
    <circle cx="100" cy="1083" r="18"/><circle cx="74" cy="1097" r="18"/><circle cx="88" cy="1119" r="18"/><circle cx="112" cy="1107" r="18"/><circle cx="94" cy="1103" r="9" fill="#f07b52"/>
    <circle cx="653" cy="1084" r="18"/><circle cx="678" cy="1096" r="18"/><circle cx="666" cy="1118" r="18"/><circle cx="640" cy="1107" r="18"/><circle cx="659" cy="1103" r="9" fill="#f07b52"/>
  </g>

  <!-- 主次入口：语义强弱明确 -->
  <g filter="url(#softShadow)">
    <path d="M120 1067 Q375 1019 630 1067 L614 1192 Q375 1234 136 1192 Z" fill="url(#cta)" stroke="#633b30" stroke-width="8"/>
    <path d="M159 1086 Q375 1050 591 1086" fill="none" stroke="#ffd98b" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <text x="375" y="1151" text-anchor="middle" fill="#3b2c27" font-size="44" font-weight="800" letter-spacing="6">踏入山隙</text>
    <path d="M558 1120 L582 1141 L558 1163" fill="none" stroke="#3b2c27" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <path d="M235 1231 Q375 1212 515 1231 L506 1292 Q375 1310 244 1292 Z" fill="#fffdf5" fill-opacity="0.86" stroke="#4b765f" stroke-width="4"/>
    <text x="375" y="1273" text-anchor="middle" fill="#486554" font-size="24" font-weight="700" letter-spacing="4">契录 · 设置</text>
  </g>
  <text x="375" y="1318" text-anchor="middle" fill="#315e48" font-size="16" font-weight="700" opacity="0.82">游方契士 · 长征由此启程</text>
</svg>
