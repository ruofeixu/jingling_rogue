      <path d="M324 3 V153" stroke="#dfd0ba" stroke-width="3"/>
      <g transform="translate(352 0)">
        <text x="0" y="24" fill="#58483b" font-size="22" font-weight="900">魂契 · 暖灶心</text>
        <path d="M0 45 H273 Q287 45 287 59 V115 Q287 129 273 129 H0 Z" fill="#fff0dd" stroke="#e99b63" stroke-width="3"/>
        <text x="17" y="76" fill="#624b3d" font-size="18" font-weight="700">体魄低于一半时，</text>
        <text x="17" y="106" fill="#624b3d" font-size="18" font-weight="700">下一次炎术灵力消耗减 1。</text>
      </g>
