      <path d="M87 143 Q96 150 105 143" fill="none" stroke="#3d3228" stroke-width="5" stroke-linecap="round"/>
      <path d="M61 172 L32 210 M130 171 L157 207" stroke="#4d4937" stroke-width="11" stroke-linecap="round"/>
      <path d="M56 190 L49 230 L82 231 M127 190 L139 230 L107 231" fill="#d88956" stroke="#4d4937" stroke-width="9" stroke-linejoin="round"/>
      <path d="M57 95 Q91 120 132 92" fill="none" stroke="#fff0b1" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>

  <!-- 前景植物制造景深 -->
  <g stroke="#315e48" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 1334 Q27 1165 91 1053 M50 1223 Q90 1189 128 1176 M56 1167 Q30 1127 24 1091" fill="none"/>
    <path d="M722 1334 Q726 1161 662 1051 M703 1214 Q664 1180 628 1170 M695 1153 Q723 1117 730 1080" fill="none"/>
  </g>
  <g fill="#66ad58" stroke="#315e48" stroke-width="5">
