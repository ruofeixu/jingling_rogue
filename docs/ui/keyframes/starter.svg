  <!-- 费用提示与主 CTA -->
  <g transform="translate(46 1061)">
    <path d="M0 0 Q328 26 656 0 L646 75 Q328 98 10 75 Z" fill="#eaf6e4" stroke="#71a969" stroke-width="4"/>
    <circle cx="37" cy="39" r="16" fill="#70b765"/>
    <path d="M29 39 L35 45 L46 31" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="47" fill="#425d3e" font-size="21" font-weight="800">已选 1 位伙伴，还可使用 6 点费用</text>
    <text x="624" y="47" text-anchor="end" fill="#567654" font-size="17" font-weight="700">点卡片可更换</text>
