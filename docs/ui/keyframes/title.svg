      <rect x="17" y="56" width="96" height="72" rx="8" fill="#fff8dc"/>
      <rect x="56" y="83" width="26" height="45" rx="5" fill="#7eaa76"/>
    </g>
  </g>
  <g fill="#4f986d">
    <circle cx="59" cy="670" r="67"/><circle cx="128" cy="680" r="57"/><circle cx="690" cy="651" r="72"/><circle cx="611" cy="677" r="55"/>
  </g>
  <path d="M0 711 Q160 653 298 739 Q465 640 750 713 L750 1334 L0 1334 Z" fill="url(#nearHill)"/>
  <g fill="#a8dc8a" opacity="0.9">
    <path d="M0 762 Q145 699 271 763 Q397 696 525 756 Q639 702 750 740 L750 808 Q626 762 515 805 Q379 749 265 812 Q123 755 0 824 Z"/>
  </g>

