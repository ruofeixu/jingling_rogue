    <g transform="translate(294 759)">
      <path d="M82 87 Q28 65 35 17 Q72 20 89 53 Q111 8 153 20 Q157 63 110 89" fill="#74bd67" stroke="#4d4937" stroke-width="9" stroke-linejoin="round"/>
      <circle cx="43" cy="31" r="16" fill="#ff9ca3"/><circle cx="145" cy="34" r="17" fill="#ff9ca3"/>
      <path d="M58 87 Q93 56 129 87 L137 169 Q111 211 66 197 Q36 170 58 87 Z" fill="#d88956" stroke="#4d4937" stroke-width="9"/>
      <path d="M76 108 Q94 92 119 109 L118 158 Q95 178 73 157 Z" fill="#f4b77d"/>
