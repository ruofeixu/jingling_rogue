        <rect x="58" y="4" width="166" height="18" rx="9" fill="#71bd72"/>
        <text x="287" y="20" fill="#4b5d49" font-size="16" font-weight="800">78</text>
        <text x="0" y="59" fill="#66564a" font-size="17" font-weight="700">灵攻</text>
        <rect x="58" y="43" width="214" height="18" rx="9" fill="#eadfce"/>
        <rect x="58" y="43" width="186" height="18" rx="9" fill="#f08a52"/>
        <text x="287" y="59" fill="#7f4934" font-size="16" font-weight="800">86</text>
        <text x="0" y="98" fill="#66564a" font-size="17" font-weight="700">身法</text>
        <rect x="58" y="82" width="214" height="18" rx="9" fill="#eadfce"/>
        <rect x="58" y="82" width="142" height="18" rx="9" fill="#65b7cc"/>
        <text x="287" y="98" fill="#3f7080" font-size="16" font-weight="800">67</text>
