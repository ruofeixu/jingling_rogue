<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1334" width="750" height="1334" role="img" aria-labelledby="starterFrameTitle starterFrameDesc">
  <title id="starterFrameTitle">选择初始精怪关键帧</title>
  <desc id="starterFrameDesc">明亮山隙营地内展示灶狸、井蛛、桃梗三张原创卡，灶狸已选中并显示费用、灵性与魂契详情。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f3ff"/>
      <stop offset="0.42" stop-color="#f3f9df"/>
      <stop offset="1" stop-color="#fff1ce"/>
    </linearGradient>
    <linearGradient id="selectCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7d8"/>
      <stop offset="1" stop-color="#ffe2b5"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb95f"/>
      <stop offset="1" stop-color="#ff7f4b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#315743" flood-opacity="0.19"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#7b5533" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="750" height="1334" fill="url(#paper)"/>
  <!-- 远景营地与山层 -->
