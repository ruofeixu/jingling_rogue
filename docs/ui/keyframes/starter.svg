      <text x="55" y="29" text-anchor="middle" fill="#815038" font-size="16" font-weight="700">费用上限</text>
      <text x="55" y="59" text-anchor="middle" fill="#3d3228" font-size="28" font-weight="900">4 / 10</text>
    </g>
  </g>

