    <g transform="translate(512 803)">
      <path d="M52 79 Q20 48 28 23 Q59 27 72 61 M103 79 Q134 47 129 21 Q99 25 85 61" fill="#76c6c9" stroke="#3e4f4e" stroke-width="9" stroke-linecap="round"/>
      <path d="M44 120 Q5 104 2 73 M44 142 Q4 151 7 183 M111 120 Q150 103 154 73 M111 142 Q151 151 148 184" fill="none" stroke="#3e4f4e" stroke-width="11" stroke-linecap="round"/>
      <path d="M40 93 Q75 52 115 92 L122 159 Q82 198 35 160 Z" fill="#56b7bf" stroke="#3e4f4e" stroke-width="9"/>
      <ellipse cx="78" cy="102" rx="42" ry="22" fill="#d4f2dc" stroke="#3e4f4e" stroke-width="8"/>
      <ellipse cx="78" cy="104" rx="25" ry="11" fill="#468e92"/>
      <circle cx="59" cy="132" r="7" fill="#263a3a"/><circle cx="96" cy="132" r="7" fill="#263a3a"/>
      <path d="M67 151 Q78 160 90 151" fill="none" stroke="#263a3a" stroke-width="5" stroke-linecap="round"/>
      <path d="M36 164 Q75 190 121 160" fill="#318a92" opacity="0.55"/>
    </g>

    <path d="M275 815 Q375 754 472 826 Q506 916 445 1009 Q350 1050 274 985 Q233 896 275 815 Z" fill="#fff9e8" stroke="#583f35" stroke-width="10"/>
