  <path d="M0 265 Q116 157 220 262 Q329 132 457 269 Q586 165 750 262 L750 442 L0 442 Z" fill="#a7d8c0"/>
  <path d="M0 326 Q134 244 264 330 Q393 229 516 327 Q640 250 750 311 L750 474 L0 474 Z" fill="#7fbd8e"/>
  <g fill="#ffffff" opacity="0.75">
    <path d="M42 139 Q66 104 104 132 Q125 102 169 128 Q185 138 186 160 L39 160 Z"/>
    <path d="M451 196 Q474 163 511 188 Q536 152 584 185 Q600 196 602 216 L447 216 Z"/>
  </g>
  <path d="M0 405 Q180 338 347 414 Q544 331 750 399 L750 1334 L0 1334 Z" fill="#d9e8b2"/>
  <path d="M0 467 Q190 414 365 475 Q555 405 750 460 L750 1334 L0 1334 Z" fill="#f7ebc4"/>

  <!-- 顶栏 -->
